<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Intercambio</title>
    <link rel="stylesheet" href="styles.css?v=3" />
  </head>
  <body>
    <header class="top">
      <h1>Intercambio</h1>
      <p id="greeting" class="greeting"></p>
      <p id="status" class="status" role="status" aria-live="polite"></p>
      <button id="refresh-button" type="button" class="ghost small">Actualizar</button>
    </header>

    <main id="app" class="app">
      <p class="loading">Cargando…</p>
    </main>

    <footer class="foot">
      <p class="muted">Todos los participantes pueden ver los nombres, las asignaciones y las opciones de regalo.</p>
    </footer>

    <script src="config.js?v=3"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
    <script src="app.js?v=3"></script>
  </body>
</html>
